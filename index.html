<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مخزن القافلة - إدارة المخزون</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: #0f172a; 
            color: #10b981; 
            padding: 20px; 
            max-width: 1000px; 
            margin: auto;
            position: relative;
            overflow-x: hidden;
        }

        .convoy-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden;
        }

        .float-icon {
            position: absolute; color: #1e293b; opacity: 0.4;
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0.1; }
            50% { opacity: 0.3; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }

        .header { 
            text-align: center; padding: 30px 20px; 
            background: rgba(16, 185, 129, 0.1); 
            backdrop-filter: blur(10px);
            border-radius: 20px; margin-bottom: 30px; 
            border: 1px solid #10b981;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2); 
        }

        .header h1 { margin: 0; font-size: 2.5em; text-shadow: 0 0 10px #10b981; }
        .header p { margin: 10px 0 0; font-size: 1.2em; opacity: 0.9; }

        .controls { 
            background: rgba(30, 41, 59, 0.8); padding: 25px; 
            border-radius: 20px; margin-bottom: 30px; 
            border: 1px solid #334155;
            box-shadow: 0 0 15px rgba(0,0,0,0.5); 
        }
        
        .controls h3 { margin-top: 0; color: #10b981; font-size: 1.5em; }
        
        label { font-weight: 600; color: #34d399; margin-bottom: 8px; display: block; }
        
        select, input { 
            padding: 12px; border: 2px solid #334155; 
            border-radius: 12px; font-family: 'Cairo', sans-serif; 
            font-size: 16px; width: 100%; box-sizing: border-box; 
            background-color: #0f172a; color: #34d399;
            transition: 0.3s;
        }
        select:focus, input:focus { border-color: #10b981; outline: none; }
        
        optgroup { background-color: #1e293b; color: #10b981; font-weight: bold; }
        option { background-color: #0f172a; color: #f8fafc; }

        .flex-container { display: flex; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
        .input-group { flex: 1; min-width: 200px; }

        .btn-group { display: flex; gap: 15px; margin-top: 25px; }
        button { 
            font-family: 'Cairo', sans-serif; cursor: pointer; 
            padding: 15px; font-size: 18px; font-weight: bold; 
            border: none; border-radius: 12px; flex: 1; 
            transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; 
        }
        
        .btn-add { background: #10b981; color: #000; box-shadow: 0 4px 10px rgba(16,185,129,0.3); }
        .btn-add:hover { background: #34d399; transform: translateY(-2px); }
        
        .btn-delete { background: transparent; color: #ef4444; border: 2px solid #ef4444; }
        .btn-delete:hover { background: #ef4444; color: #fff; transform: translateY(-2px); }

        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .table-container { overflow-x: auto; }
        table { 
            width: 100%; border-collapse: collapse; 
            background: rgba(30, 41, 59, 0.8); border-radius: 15px; 
            overflow: hidden; border: 1px solid #334155; 
        }
        th, td { padding: 15px; text-align: center; border-bottom: 1px solid #334155; }
        th { background: #1e293b; color: #10b981; font-size: 1.1em; }
        tbody tr:hover { background: rgba(51, 65, 85, 0.6); }
        
        .cat-badge { 
            background: #0f172a; padding: 4px 10px; border-radius: 8px; 
            font-size: 0.9em; border: 1px solid #334155; color: #94a3b8;
        }

        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #10b981; color: #000; font-weight: bold;
            padding: 12px 25px; border-radius: 20px; display: none; z-index: 1000;
        }
    </style>
</head>
<body>

    <div class="convoy-bg" id="bgIcons"></div>

    <div class="header">
        <h1>📦 مخزن القافلة 🚚</h1>
        <p>نظام ذكي لإدارة الأصناف، الوارد، والمنصرف</p>
    </div>

    <div class="controls">
        <h3>🔄 تسجيل حركة المخزون</h3>
        
        <div class="input-group" style="margin-top: 15px;">
            <label>🔍 اختر الصنف:</label>
            <select id="itemSelect">
                <option value="">⏳ جاري التحميل...</option>
            </select>
        </div>
        
        <div class="flex-container">
            <div class="input-group">
                <label>🔢 الكمية المراد إضافتها أو صرفها:</label>
                <input type="number" id="amountInput" value="1" min="1">
            </div>
        </div>
        
        <div class="btn-group">
            <button onclick="updateInventory('add')" class="btn-add" id="addBtn">📥 إضافة (وارد)</button>
            <button onclick="updateInventory('subtract')" class="btn-delete" id="subBtn">📤 سحب (منصرف)</button>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>القسم</th>
                    <th>اسم الصنف</th>
                    <th>الوحدة</th>
                    <th>الإجمالي</th>
                    <th>المنصرف</th>
                    <th>المتبقي</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="6" style="padding:40px; color:#10b981;">⏳ جاري سحب بيانات المخزن...</td></tr>
            </tbody>
        </table>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbw4VJ3mTbIsu-i3UAJUddPFIvHro4YlPYBL3U1A1k87a9CPhHlZBwAbJbjCUXty0tsGLw/exec';

        const bgIcons = document.getElementById('bgIcons');
        const icons = ['📦', '🥫', '🍼', '🧸', '🍽️', '🚚'];
        for (let i = 0; i < 15; i++) {
            const span = document.createElement('span');
            span.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            span.className = 'float-icon';
            span.style.left = Math.random() * 100 + '%';
            span.style.animationDuration = (Math.random() * 10 + 15) + 's';
            span.style.animationDelay = Math.random() * 5 + 's';
            span.style.fontSize = (Math.random() * 20 + 30) + 'px';
            bgIcons.appendChild(span);
        }

        function showMessage(text) {
            const toast = document.getElementById('toast');
            toast.textContent = text;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        async function loadData() {
            try {
                const response = await fetch(scriptURL);
                const data = await response.json();
                
                const tbody = document.getElementById('tableBody');
                const select = document.getElementById('itemSelect');
                
                tbody.innerHTML = '';
                select.innerHTML = '<option value="" disabled selected>-- اختر الصنف --</option>';
                
                const groupedData = data.reduce((acc, item) => {
                    acc[item.sheet] = acc[item.sheet] || [];
                    acc[item.sheet].push(item);
                    return acc;
                }, {});

                for (let sheetName in groupedData) {
                    let optGroup = document.createElement('optgroup');
                    optGroup.label = `📂 قسم: ${sheetName}`;
                    
                    groupedData[sheetName].forEach(item => {
                        let option = document.createElement('option');
                        option.value = `${item.sheet}|${item.item}`;
                        option.textContent = `${item.item} (${item.unit})`;
                        optGroup.appendChild(option);

                        let tr = document.createElement('tr');
                        let isWarning = item.remaining <= 0 ? 'color: #ef4444; font-weight: bold;' : '';
                        
                        tr.innerHTML = `
                            <td><span class="cat-badge">${item.sheet}</span></td>
                            <td style="font-weight: 600;">${item.item}</td>
                            <td>${item.unit}</td>
                            <td>${item.quantity}</td>
                            <td style="color: #ef4444;">${item.issued}</td>
                            <td style="font-size: 1.1em; ${isWarning}">${item.remaining}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                    select.appendChild(optGroup);
                }

            } catch (error) {
                console.error("Error loading data:", error);
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="6" style="color: #ef4444;">⚠️ حدث خطأ في الاتصال، تأكد من أن الرابط ينتهي بـ /exec وصلاحياته للجميع (Anyone).</td></tr>';
            }
        }

        async function updateInventory(action) {
            const selectVal = document.getElementById('itemSelect').value;
            if (!selectVal) {
                alert("يرجى اختيار الصنف أولاً!");
                return;
            }

            const [sheet, item] = selectVal.split('|');
            let amount = parseInt(document.getElementById('amountInput').value) || 0;
            
            if (amount <= 0) {
                alert("يرجى إدخال كمية صحيحة أكبر من صفر!");
                return;
            }

            document.getElementById('addBtn').disabled = true;
            document.getElementById('subBtn').disabled = true;
            const originalAddText = document.getElementById('addBtn').innerHTML;
            const originalSubText = document.getElementById('subBtn').innerHTML;
            
            if(action === 'add') document.getElementById('addBtn').innerHTML = "⏳ جاري الإضافة...";
            else document.getElementById('subBtn').innerHTML = "⏳ جاري السحب...";

            let formData = new FormData();
            formData.append('sheet', sheet);
            formData.append('item', item);
            formData.append('amount', amount);
            formData.append('action', action);

            try {
                await fetch(scriptURL, { method: 'POST', body: formData });
                document.getElementById('amountInput').value = 1;
                await loadData();
                showMessage(`تمت العملية بنجاح لصنف: ${item}`);
            } catch (error) {
                console.error('Error updating!', error);
                alert("⚠️ حدث خطأ أثناء التحديث!");
            } finally {
                document.getElementById('addBtn').disabled = false;
                document.getElementById('subBtn').disabled = false;
                document.getElementById('addBtn').innerHTML = originalAddText;
                document.getElementById('subBtn').innerHTML = originalSubText;
            }
        }

        loadData();
    </script>
</body>
</html>
