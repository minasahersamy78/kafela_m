<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مخزن القافلة - عرض المخزون</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #10b981; padding: 15px; max-width: 1000px; margin: auto; box-sizing: border-box;}
        .header { text-align: center; padding: 20px; background: rgba(16, 185, 129, 0.1); border-radius: 15px; margin-bottom: 20px; border: 1px solid #10b981; box-shadow: 0 0 20px rgba(16, 185, 129, 0.2); }
        .header h1 { margin: 0; font-size: 2em; text-shadow: 0 0 10px #10b981; }
        .header p { margin: 5px 0 0; font-size: 1.1em; opacity: 0.9; }
        
        .filter-container { background: #1e293b; padding: 15px; border-radius: 10px; border: 1px solid #334155; display: flex; align-items: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap;}
        .filter-container label { margin-bottom: 0; font-weight: 600; color: #34d399; }
        select { 
            padding: 10px; border: 2px solid #334155; border-radius: 10px; 
            background-color: #0f172a; color: #34d399; font-family: 'Cairo'; 
            font-size: 16px; min-width: 200px; -webkit-appearance: none; appearance: none;
        }
        
        .table-container { overflow-x: auto; width: 100%; }
        table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 15px; overflow: hidden; border: 1px solid #334155; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #334155; white-space: nowrap; }
        th { background: #0f172a; color: #10b981; font-size: 1em; }
        tbody tr:hover { background: rgba(51, 65, 85, 0.6); }
        .cat-badge { background: #0f172a; padding: 4px 10px; border-radius: 8px; font-size: 0.9em; border: 1px solid #334155; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📦 مخزن القافلة</h1>
        <p>عرض حالة المخزون والأصناف المتوفرة</p>
    </div>

    <div class="filter-container">
        <label>🔍 عرض الأصناف لقسم:</label>
        <select id="filterCategory" onchange="renderTable()">
            <option value="الكل">عرض كل الأقسام</option>
        </select>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>القسم</th>
                    <th>اسم الصنف</th>
                    <th>الكمية</th>
                    <th>الوحدة</th>
                    <th>المنصرف</th>
                    <th>المتبقي</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="6" style="padding:40px; color:#10b981;">⏳ جاري سحب بيانات المخزن...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwV-M-vu_qe6Xt94Pm6ndiKBjU40aSMQGXXNtLFTsfwAGNUKK7nxDwEGxUNVUcGLEiecw/exec';
        let globalData = [];
        let categories = new Set();

        async function loadData() {
            try {
                const response = await fetch(scriptURL);
                const data = await response.json();
                globalData = data;
                
                const filterSelect = document.getElementById('filterCategory');
                data.forEach(item => categories.add(item.sheet));
                categories.forEach(cat => {
                    filterSelect.innerHTML += `<option value="${cat}">${cat}</option>`;
                });

                renderTable();
            } catch (error) {
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="6" style="color: #ef4444;">⚠️ حدث خطأ في تحميل البيانات.</td></tr>';
            }
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const filterValue = document.getElementById('filterCategory').value;
            tbody.innerHTML = '';

            let filteredData = globalData;
            if (filterValue !== 'الكل') {
                filteredData = globalData.filter(item => item.sheet === filterValue);
            }

            if (filteredData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6">لا توجد أصناف في هذا القسم.</td></tr>';
                return;
            }

            filteredData.forEach(item => {
                let isWarning = item.remaining <= 0 ? 'color: #ef4444; font-weight: bold;' : '';
                tbody.innerHTML += `
                    <tr>
                        <td><span class="cat-badge">${item.sheet}</span></td>
                        <td style="font-weight: 600;">${item.item}</td>
                        <td>${item.quantity}</td>
                        <td>${item.unit}</td>
                        <td style="color: #ef4444;">${item.issued}</td>
                        <td style="font-size: 1.1em; ${isWarning}">${item.remaining}</td>
                    </tr>
                `;
            });
        }

        loadData();
    </script>
</body>
</html>
