<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مخزن القافلة - عرض المخزون</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; padding: 20px; max-width: 900px; margin: auto; box-sizing: border-box; }
        
        /* تصميم الهيدر مع اللوجو */
        .header { 
            text-align: center; 
            padding: 35px 20px; 
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.1) 0%, rgba(16, 185, 129, 0.1) 100%); 
            border-radius: 20px; 
            margin-bottom: 30px; 
            border: 2px solid #1e40af; 
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.15);
            position: relative;
        }
        
        /* إطار دائري متوهج للوجو */
        .logo-container {
            width: 140px;
            height: 140px;
            background-color: #ffffff;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.5), 0 0 10px rgba(16, 185, 129, 0.4);
            border: 4px solid #3b82f6;
            overflow: hidden;
        }
        .logo-container img {
            width: 90%;
            height: 90%;
            object-fit: contain;
        }
        
        .header h1 { margin: 5px 0 0; font-size: 2.2em; color: #3b82f6; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        
        .filter-container { 
            background: #1e293b; 
            padding: 20px; 
            border-radius: 20px; 
            border: 1px solid #334155; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            margin-bottom: 25px; 
            flex-wrap: wrap;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        .filter-container label { margin-bottom: 0; font-weight: 700; color: #38bdf8; font-size: 1.1em;}
        select { 
            flex: 1;
            padding: 14px 18px; 
            border: 2px solid #334155; 
            border-radius: 12px; 
            background-color: #0f172a; 
            color: #f8fafc; 
            font-family: 'Cairo'; 
            font-size: 16px; 
            min-width: 200px; 
            -webkit-appearance: none; 
            appearance: none;
            transition: all 0.3s ease;
        }
        select:focus {
            border-color: #3b82f6; 
            outline: none; 
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.3);
        }
        
        .table-container { overflow-x: auto; width: 100%; border-radius: 15px; border: 1px solid #334155;}
        table { width: 100%; border-collapse: collapse; background: #1e293b; overflow: hidden; font-size: 1em; }
        th, td { padding: 15px; text-align: center; border-bottom: 1px solid #334155; white-space: nowrap; }
        th { background: #0f172a; color: #38bdf8; font-weight: 700; font-size: 1.05em; }
        tbody tr:hover { background: rgba(51, 65, 85, 0.6); }
        .cat-badge { background: #0f172a; padding: 4px 10px; border-radius: 8px; font-size: 0.9em; border: 1px solid #10b981; color: #f8fafc; }
    </style>
</head>
<body>
    
    <!-- الهيدر مع اللوجو -->
    <div class="header">
        <div class="logo-container">
            <img src="logo.jpg" alt="شعار القافلة" onerror="this.style.display='none';">
        </div>
        <h1>📦 مخزن القافلة</h1>
    </div>

    <div class="filter-container">
        <label>🔍 عرض الأصناف لقسم:</label>
        <select id="filterCategory" onchange="renderTable()">
            <option value="الكل">عرض كل الأقسام</option>
        </select>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>القسم</th>
                    <th>اسم الصنف</th>
                    <th>الوحدة</th>
                    <th>المتبقي</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="4" style="padding:40px; color:#38bdf8; font-weight: bold;">⏳ جاري سحب بيانات المخزن...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwV-M-vu_qe6Xt94Pm6ndiKBjU40aSMQGXXNtLFTsfwAGNUKK7nxDwEGxUNVUcGLEiecw/exec';
        let globalData = [];
        let categories = new Set();

        async function loadData() {
            try {
                const response = await fetch(scriptURL);
                const data = await response.json();
                globalData = data;
                
                const filterSelect = document.getElementById('filterCategory');
                data.forEach(item => categories.add(item.sheet));
                categories.forEach(cat => {
                    filterSelect.innerHTML += `<option value="${cat}">${cat}</option>`;
                });

                renderTable();
            } catch (error) {
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="4" style="color: #ef4444; font-weight: bold; padding: 20px;">⚠️ حدث خطأ في تحميل البيانات.</td></tr>';
            }
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const filterValue = document.getElementById('filterCategory').value;
            tbody.innerHTML = '';

            let filteredData = globalData;
            if (filterValue !== 'الكل') {
                filteredData = globalData.filter(item => item.sheet === filterValue);
            }

            if (filteredData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="padding: 20px;">لا توجد أصناف في هذا القسم.</td></tr>';
                return;
            }

            filteredData.forEach(item => {
                let isWarning = item.remaining <= 0 ? 'color: #ef4444; font-weight: bold;' : 'color: #10b981; font-weight: bold;';
                tbody.innerHTML += `
                    <tr>
                        <td><span class="cat-badge">${item.sheet}</span></td>
                        <td style="font-weight: 700; color: #f8fafc;">${item.item}</td>
                        <td>${item.unit}</td>
                        <td style="font-size: 1.15em; ${isWarning}">${item.remaining}</td>
                    </tr>
                `;
            });
        }

        loadData();
    </script>
</body>
</html>
