<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المخزن (أدمن)</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #10b981; padding: 20px; max-width: 1000px; margin: auto; }
        .header { text-align: center; padding: 30px 20px; background: rgba(16, 185, 129, 0.1); border-radius: 20px; margin-bottom: 30px; border: 1px solid #10b981; box-shadow: 0 0 20px rgba(16, 185, 129, 0.2); }
        .header h1 { margin: 0; font-size: 2.5em; text-shadow: 0 0 10px #10b981; }
        
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-top: 50px; background: #1e293b; padding: 40px; border-radius: 15px; border: 1px solid #334155; max-width: 400px; margin: auto; }
        #login-screen input { width: 100%; padding: 12px; border: 2px solid #334155; border-radius: 10px; background-color: #0f172a; color: #34d399; font-family: 'Cairo'; font-size: 16px; margin-bottom: 15px; text-align: center;}
        #login-screen button { width: 100%; padding: 15px; background: #10b981; color: #000; font-size: 18px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        #login-error { color: #ef4444; display: none; margin-top: 10px; font-weight: bold;}

        #admin-content { display: none; }

        .controls { background: rgba(30, 41, 59, 0.8); padding: 25px; border-radius: 20px; margin-bottom: 30px; border: 1px solid #334155; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        .controls h3 { margin-top: 0; color: #10b981; font-size: 1.5em; }
        label { font-weight: 600; color: #34d399; margin-bottom: 8px; display: block; }
        select, input { padding: 12px; border: 2px solid #334155; border-radius: 12px; font-family: 'Cairo'; font-size: 16px; width: 100%; box-sizing: border-box; background-color: #0f172a; color: #34d399; }
        
        .flex-container { display: flex; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
        .input-group { flex: 1; min-width: 200px; }
        .btn-group { display: flex; gap: 15px; margin-top: 25px; }
        button { font-family: 'Cairo'; cursor: pointer; padding: 15px; font-size: 18px; font-weight: bold; border: none; border-radius: 12px; flex: 1; transition: 0.3s;}
        .btn-add { background: #10b981; color: #000; }
        .btn-delete { background: transparent; color: #ef4444; border: 2px solid #ef4444; }
        
        .filter-container { background: rgba(30, 41, 59, 0.8); padding: 15px; border-radius: 10px; border: 1px solid #334155; display: flex; align-items: center; gap: 15px; margin-bottom: 20px;}
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; background: rgba(30, 41, 59, 0.8); border-radius: 15px; overflow: hidden; border: 1px solid #334155; }
        th, td { padding: 15px; text-align: center; border-bottom: 1px solid #334155; }
        th { background: #1e293b; color: #10b981; font-size: 1.1em; }
        .cat-badge { background: #0f172a; padding: 4px 10px; border-radius: 8px; font-size: 0.9em; border: 1px solid #334155; color: #94a3b8; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🛡️ إدارة المخزن (أدمن)</h1>
    </div>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen">
        <label>أدخل كلمة المرور:</label>
        <input type="password" id="adminPass" placeholder="كلمة المرور..." onkeypress="if(event.key === 'Enter') checkPassword()">
        <button id="loginBtn" onclick="checkPassword()">تسجيل الدخول</button>
        <div id="login-error">❌ كلمة المرور غير صحيحة</div>
    </div>

    <div id="admin-content">
        <!-- لوحة التحكم للإضافة والسحب -->
        <div class="controls">
            <h3>🔄 تسجيل حركة المخزون</h3>
            <div class="input-group" style="margin-top: 15px;">
                <label>🔍 اختر الصنف:</label>
                <select id="itemSelect">
                    <option value="">⏳ جاري التحميل...</option>
                </select>
            </div>
            
            <div class="flex-container">
                <div class="input-group">
                    <label>🔢 الكمية المراد إضافتها أو صرفها:</label>
                    <input type="number" id="amountInput" value="1" min="1">
                </div>
            </div>
            
            <div class="btn-group">
                <button onclick="updateInventory('add')" class="btn-add" id="addBtn">📥 إضافة (وارد)</button>
                <button onclick="updateInventory('subtract')" class="btn-delete" id="subBtn">📤 سحب (منصرف)</button>
            </div>
        </div>

        <!-- فلتر الأقسام -->
        <div class="filter-container">
            <label>🔍 فلترة الجدول لقسم:</label>
            <select id="filterCategory" onchange="renderTable()">
                <option value="الكل">عرض كل الأقسام</option>
            </select>
        </div>

        <!-- جدول البيانات -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>القسم</th>
                        <th>اسم الصنف</th>
                        <th>الكمية</th>
                        <th>الوحدة</th>
                        <th>المنصرف</th>
                        <th>المتبقي</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="6" style="padding:40px; color:#10b981;">⏳ جاري سحب بيانات المخزن...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyPq0BHN_rzdMfY9o1CC6GSv2-Ik38EDa2pQvqn3Jnmu3HE9PPxZY_N-uNvQ91A4lT7BQ/exec';
        
        let globalData = [];
        let categories = new Set();
        let activeToken = '';

        async function checkPassword() {
            const passInput = document.getElementById('adminPass').value;
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('login-error');
            
            btn.innerText = '⏳ جاري التحقق...';
            btn.disabled = true;
            errorMsg.style.display = 'none';

            try {
                const res = await fetch(scriptURL + "?action=verifyPass&pass=" + encodeURIComponent(passInput));
                const data = await res.json();
                
                if (data.error) {
                    errorMsg.innerText = "❌ " + data.error;
                    errorMsg.style.display = 'block';
                } else {
                    activeToken = passInput; 
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('admin-content').style.display = 'block';
                    loadData(); 
                }
            } catch (error) {
                errorMsg.innerText = '⚠️ حدث خطأ في الاتصال بالسيرفر.';
                errorMsg.style.display = 'block';
            } finally {
                btn.innerText = 'تسجيل الدخول';
                btn.disabled = false;
            }
        }

        async function loadData() {
            try {
                const response = await fetch(scriptURL);
                const data = await response.json();
                globalData = data;
                
                const tbody = document.getElementById('tableBody');
                const select = document.getElementById('itemSelect');
                const filterSelect = document.getElementById('filterCategory');
                
                select.innerHTML = '<option value="" disabled selected>-- اختر الصنف --</option>';
                filterSelect.innerHTML = '<option value="الكل">عرض كل الأقسام</option>';
                categories.clear();

                const groupedData = data.reduce((acc, item) => {
                    acc[item.sheet] = acc[item.sheet] || [];
                    acc[item.sheet].push(item);
                    categories.add(item.sheet);
                    return acc;
                }, {});

                categories.forEach(cat => {
                    filterSelect.innerHTML += `<option value="${cat}">${cat}</option>`;
                });

                for (let sheetName in groupedData) {
                    let optGroup = document.createElement('optgroup');
                    optGroup.label = `📂 قسم: ${sheetName}`;
                    groupedData[sheetName].forEach(item => {
                        let option = document.createElement('option');
                        option.value = `${item.sheet}|${item.item}`;
                        option.textContent = `${item.item} (${item.unit})`;
                        optGroup.appendChild(option);
                    });
                    select.appendChild(optGroup);
                }

                renderTable();
            } catch (error) {
                console.error(error);
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="6" style="color: #ef4444;">⚠️ حدث خطأ في الاتصال.</td></tr>';
            }
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const filterValue = document.getElementById('filterCategory').value;
            tbody.innerHTML = '';

            let filteredData = globalData;
            if (filterValue !== 'الكل') {
                filteredData = globalData.filter(item => item.sheet === filterValue);
            }

            if (filteredData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6">لا توجد أصناف.</td></tr>';
                return;
            }

            filteredData.forEach(item => {
                let isWarning = item.remaining <= 0 ? 'color: #ef4444; font-weight: bold;' : '';
                tbody.innerHTML += `
                    <tr>
                        <td><span class="cat-badge">${item.sheet}</span></td>
                        <td style="font-weight: 600;">${item.item}</td>
                        <td>${item.quantity}</td>
                        <td>${item.unit}</td>
                        <td style="color: #ef4444;">${item.issued}</td>
                        <td style="font-size: 1.1em; ${isWarning}">${item.remaining}</td>
                    </tr>
                `;
            });
        }

        async function updateInventory(action) {
            const selectVal = document.getElementById('itemSelect').value;
            if (!selectVal) return alert("يرجى اختيار الصنف أولاً!");

            const [sheet, item] = selectVal.split('|');
            let amount = parseInt(document.getElementById('amountInput').value) || 0;
            
            if (amount <= 0) return alert("يرجى إدخال كمية صحيحة أكبر من صفر!");

            document.getElementById('addBtn').disabled = true;
            document.getElementById('subBtn').disabled = true;
            const originalAddText = document.getElementById('addBtn').innerHTML;
            const originalSubText = document.getElementById('subBtn').innerHTML;
            
            if(action === 'add') document.getElementById('addBtn').innerHTML = "⏳ جاري الإضافة...";
            else document.getElementById('subBtn').innerHTML = "⏳ جاري السحب...";

            let formData = new FormData();
            formData.append('sheet', sheet);
            formData.append('item', item);
            formData.append('amount', amount);
            formData.append('action', action);
            formData.append('pass', activeToken); 

            try {
                const response = await fetch(scriptURL, { method: 'POST', body: formData });
                const result = await response.json();

                if(result.error) {
                    alert("⚠️ " + result.error);
                } else {
                    document.getElementById('amountInput').value = 1;
                    await loadData();
                    alert(`✅ تمت العملية بنجاح لصنف: ${item}`);
                }
            } catch (error) {
                alert("⚠️ حدث خطأ أثناء التحديث!");
            } finally {
                document.getElementById('addBtn').disabled = false;
                document.getElementById('subBtn').disabled = false;
                document.getElementById('addBtn').innerHTML = originalAddText;
                document.getElementById('subBtn').innerHTML = originalSubText;
            }
        }
    </script>
</body>
</html>
