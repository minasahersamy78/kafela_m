<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إدارة المخزن (أدمن)</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #10b981; padding: 15px; max-width: 1000px; margin: auto; box-sizing: border-box; }
        .header { text-align: center; padding: 20px; background: rgba(16, 185, 129, 0.1); border-radius: 15px; margin-bottom: 25px; border: 1px solid #10b981; }
        .header h1 { margin: 0; font-size: 2.2em; text-shadow: 0 0 10px #10b981; }
        
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-top: 50px; background: #1e293b; padding: 40px; border-radius: 15px; border: 1px solid #334155; max-width: 400px; margin: auto; }
        #login-error { color: #ef4444; display: none; margin-top: 10px; font-weight: bold;}

        #admin-content { display: none; }

        .controls { background: #1e293b; padding: 20px; border-radius: 15px; margin-bottom: 25px; border: 1px solid #334155; box-shadow: 0 0 15px rgba(0,0,0,0.5); width: 100%; box-sizing: border-box; }
        .controls h3 { margin-top: 0; color: #10b981; font-size: 1.3em; }
        label { font-weight: 600; color: #34d399; margin-bottom: 5px; display: block; font-size: 0.95em; }
        
        select, input { 
            width: 100%; display: block; padding: 12px; border: 2px solid #334155; 
            border-radius: 10px; background-color: #0f172a; color: #34d399; 
            font-family: 'Cairo', sans-serif; font-size: 16px; box-sizing: border-box; 
            -webkit-appearance: none; appearance: none;
        }
        select:focus, input:focus { border-color: #10b981; outline: none; }
        
        .grid { display: flex; flex-direction: column; gap: 15px; margin-top: 15px; width: 100%; }
        @media (min-width: 768px) { .grid { display: grid; grid-template-columns: 1fr 1fr; } }

        .btn-group { display: flex; gap: 15px; margin-top: 20px; }
        button { font-family: 'Cairo'; cursor: pointer; padding: 15px; font-size: 17px; font-weight: bold; border: none; border-radius: 10px; flex: 1; transition: 0.3s;}
        .btn-add { background: #10b981; color: #000; }
        .btn-delete { background: transparent; color: #ef4444; border: 2px solid #ef4444; }
        .btn-new { background: #3b82f6; color: #fff; margin-top: 15px; }
        
        .btn-row-delete { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-family: 'Cairo'; font-weight: bold; font-size: 13px; width: auto; }
        .btn-row-delete:hover { background: #dc2626; }

        .filter-container { background: #1e293b; padding: 15px; border-radius: 10px; border: 1px solid #334155; display: flex; align-items: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap;}
        .table-container { overflow-x: auto; width: 100%; }
        table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 10px; overflow: hidden; font-size: 0.9em; }
        th, td { padding: 10px; text-align: center; border-bottom: 1px solid #334155; white-space: nowrap; }
        th { background: #0f172a; color: #10b981; }
        .cat-badge { background: #0f172a; padding: 4px 8px; border-radius: 6px; font-size: 0.85em; border: 1px solid #334155; color: #94a3b8; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🛡️ إدارة المخزن (أدمن)</h1>
    </div>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen">
        <label style="color:#34d399; font-size:1.2em; margin-bottom:15px;">أدخل كلمة المرور:</label>
        <input type="password" id="adminPass" placeholder="كلمة المرور..." onkeypress="if(event.key === 'Enter') checkPassword()">
        <button id="loginBtn" onclick="checkPassword()" style="margin-top:15px;">تسجيل الدخول</button>
        <div id="login-error">❌ كلمة المرور غير صحيحة</div>
    </div>

    <div id="admin-content">
        <!-- 1. تسجيل حركة وارد/منصرف -->
        <div class="controls">
            <h3>🔄 تسجيل حركة وارد / منصرف</h3>
            <div style="margin-top: 15px;">
                <label>🔍 اختر الصنف:</label>
                <select id="itemSelect">
                    <option value="">⏳ جاري التحميل...</option>
                </select>
            </div>
            
            <div style="margin-top: 15px;">
                <label>🔢 الكمية المراد إضافتها أو صرفها:</label>
                <input type="number" id="amountInput" value="1" min="0.1" step="0.1">
            </div>
            
            <div class="btn-group">
                <button onclick="updateInventory('add')" class="btn-add" id="addBtn">📥 إضافة (وارد)</button>
                <button onclick="updateInventory('subtract')" class="btn-delete" id="subBtn">📤 سحب (منصرف)</button>
            </div>
        </div>

        <!-- 2. إضافة صنف جديد كلياً للمخزن -->
        <div class="controls">
            <h3>➕ إضافة منتج جديد كلياً للمخزن</h3>
            <div class="grid">
                <div>
                    <label>القسم / الشيت:</label>
                    <input type="text" id="newCategory" placeholder="مثال: أكل، ألعاب، بلاستيكات...">
                </div>
                <div>
                    <label>اسم المنتج الجديد:</label>
                    <input type="text" id="newItemName" placeholder="اسم المنتج...">
                </div>
                <div>
                    <label>الكمية الأولية:</label>
                    <input type="number" id="newItemQty" value="1" min="0">
                </div>
                <div>
                    <label>الوحدة:</label>
                    <select id="newItemUnit">
                        <option value="قطعه">قطعه</option>
                        <option value="كيلو">كيلو</option>
                        <option value="لتر">لتر</option>
                        <option value="كيس">كيس</option>
                        <option value="علبة">علبة</option>
                    </select>
                </div>
            </div>
            <button onclick="addNewProduct()" class="btn-new" id="newProdBtn">✨ إضافة المنتج للمخزن</button>
        </div>

        <!-- فلتر وتصفية الجدول -->
        <div class="filter-container">
            <label>🔍 فلترة الجدول لقسم:</label>
            <select id="filterCategory" onchange="renderTable()">
                <option value="الكل">عرض كل الأقسام</option>
            </select>
        </div>

        <!-- جدول المخزون -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>القسم</th>
                        <th>اسم الصنف</th>
                        <th>الكمية</th>
                        <th>الوحدة</th>
                        <th>المنصرف</th>
                        <th>المتبقي</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="7" style="padding:40px; color:#10b981;">⏳ جاري سحب بيانات المخزن...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbx4ImcGwwmECRZa6HjKtbYMruh9E4fidWCh-V-FgTqwup0uyDZrUoqNRl3oJSgjeQovVA/exec';
        
        let globalData = [];
        let categories = new Set();
        let activeToken = '';

        async function checkPassword() {
            const passInput = document.getElementById('adminPass').value;
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('login-error');
            
            btn.innerText = '⏳ جاري التحقق...';
            btn.disabled = true;
            errorMsg.style.display = 'none';

            try {
                const res = await fetch(scriptURL + "?action=verifyPass&pass=" + encodeURIComponent(passInput));
                const data = await res.json();
                
                if (data.error) {
                    errorMsg.innerText = "❌ " + data.error;
                    errorMsg.style.display = 'block';
                } else {
                    activeToken = passInput; 
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('admin-content').style.display = 'block';
                    loadData(); 
                }
            } catch (error) {
                errorMsg.innerText = '⚠️ حدث خطأ في الاتصال بالسيرفر.';
                errorMsg.style.display = 'block';
            } finally {
                btn.innerText = 'تسجيل الدخول';
                btn.disabled = false;
            }
        }

        async function loadData() {
            try {
                const response = await fetch(scriptURL);
                const data = await response.json();
                globalData = data;
                
                const tbody = document.getElementById('tableBody');
                const select = document.getElementById('itemSelect');
                const filterSelect = document.getElementById('filterCategory');
                
                select.innerHTML = '<option value="" disabled selected>-- اختر الصنف --</option>';
                filterSelect.innerHTML = '<option value="الكل">عرض كل الأقسام</option>';
                categories.clear();

                const groupedData = data.reduce((acc, item) => {
                    acc[item.sheet] = acc[item.sheet] || [];
                    acc[item.sheet].push(item);
                    categories.add(item.sheet);
                    return acc;
                }, {});

                categories.forEach(cat => {
                    filterSelect.innerHTML += `<option value="${cat}">${cat}</option>`;
                });

                for (let sheetName in groupedData) {
                    let optGroup = document.createElement('optgroup');
                    optGroup.label = `📂 قسم: ${sheetName}`;
                    groupedData[sheetName].forEach(item => {
                        let option = document.createElement('option');
                        option.value = `${item.sheet}|${item.item}`;
                        option.textContent = `${item.item} (${item.unit})`;
                        optGroup.appendChild(option);
                    });
                    select.appendChild(optGroup);
                }

                renderTable();
            } catch (error) {
                console.error(error);
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="7" style="color: #ef4444;">⚠️ حدث خطأ في الاتصال.</td></tr>';
            }
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const filterValue = document.getElementById('filterCategory').value;
            tbody.innerHTML = '';

            let filteredData = globalData;
            if (filterValue !== 'الكل') {
                filteredData = globalData.filter(item => item.sheet === filterValue);
            }

            if (filteredData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7">لا توجد أصناف.</td></tr>';
                return;
            }

            filteredData.forEach(item => {
                let isWarning = item.remaining <= 0 ? 'color: #ef4444; font-weight: bold;' : '';
                
                // تنظيف الاسم للشيت والصنف لمنع مشاكل العبارات النصية في الدالة
                let cleanSheet = item.sheet.replace(/'/g, "\\'");
                let cleanItem = item.item.replace(/'/g, "\\'");

                tbody.innerHTML += `
                    <tr>
                        <td><span class="cat-badge">${item.sheet}</span></td>
                        <td style="font-weight: 600;">${item.item}</td>
                        <td>${item.quantity}</td>
                        <td>${item.unit}</td>
                        <td style="color: #ef4444;">${item.issued}</td>
                        <td style="font-size: 1.1em; ${isWarning}">${item.remaining}</td>
                        <td>
                            <button class="btn-row-delete" onclick="deleteProduct('${cleanSheet}', '${cleanItem}', this)">مسح 🗑️</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function deleteProduct(sheet, item, btn) {
            if (!confirm(`⚠️ هل أنت متأكد من مسح المنتج "${item}" بالكامل من قسم "${sheet}"؟`)) return;

            let originalText = btn.innerText;
            btn.innerText = "⏳";
            btn.disabled = true;

            let formData = new FormData();
            formData.append('action', 'deleteProduct');
            formData.append('sheet', sheet);
            formData.append('item', item);
            formData.append('pass', activeToken);

            try {
                const response = await fetch(scriptURL, { method: 'POST', body: formData });
                const result = await response.json();

                if (result.error) {
                    alert("⚠️ " + result.error);
                    btn.innerText = originalText;
                    btn.disabled = false;
                } else {
                    alert(`✅ تم مسح المنتج "${item}" بنجاح!`);
                    await loadData();
                }
            } catch (error) {
                alert("⚠️ حدث خطأ أثناء المسح!");
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        async function updateInventory(action) {
            const selectVal = document.getElementById('itemSelect').value;
            if (!selectVal) return alert("يرجى اختيار الصنف أولاً!");

            const [sheet, item] = selectVal.split('|');
            let amount = parseFloat(document.getElementById('amountInput').value) || 0;
            
            if (amount <= 0) return alert("يرجى إدخال كمية صحيحة أكبر من صفر!");

            document.getElementById('addBtn').disabled = true;
            document.getElementById('subBtn').disabled = true;

            let formData = new FormData();
            formData.append('sheet', sheet);
            formData.append('item', item);
            formData.append('amount', amount);
            formData.append('action', action);
            formData.append('pass', activeToken); 

            try {
                const response = await fetch(scriptURL, { method: 'POST', body: formData });
                const result = await response.json();

                if(result.error) {
                    alert("⚠️ " + result.error);
                } else {
                    document.getElementById('amountInput').value = 1;
                    await loadData();
                    alert(`✅ تمت العملية بنجاح لصنف: ${item}`);
                }
            } catch (error) {
                alert("⚠️ حدث خطأ أثناء التحديث!");
            } finally {
                document.getElementById('addBtn').disabled = false;
                document.getElementById('subBtn').disabled = false;
            }
        }

        async function addNewProduct() {
            const category = document.getElementById('newCategory').value.trim();
            const itemName = document.getElementById('newItemName').value.trim();
            const qty = document.getElementById('newItemQty').value;
            const unit = document.getElementById('newItemUnit').value;

            if (!category || !itemName) {
                return alert("يرجى إدخال اسم القسم واسم المنتج الجديد!");
            }

            const btn = document.getElementById('newProdBtn');
            btn.disabled = true;
            btn.innerText = "⏳ جاري إضافة المنتج...";

            let formData = new FormData();
            formData.append('action', 'addNewItem');
            formData.append('sheet', category);
            formData.append('item', itemName);
            formData.append('quantity', qty);
            formData.append('unit', unit);
            formData.append('pass', activeToken);

            try {
                const response = await fetch(scriptURL, { method: 'POST', body: formData });
                const result = await response.json();

                if (result.error) {
                    alert("⚠️ " + result.error);
                } else {
                    alert(`✅ تم إضافة المنتج "${itemName}" بنجاح في قسم "${category}"!`);
                    document.getElementById('newCategory').value = '';
                    document.getElementById('newItemName').value = '';
                    document.getElementById('newItemQty').value = 1;
                    await loadData();
                }
            } catch (error) {
                alert("⚠️ حدث خطأ أثناء إضافة المنتج الجديد!");
            } finally {
                btn.disabled = false;
                btn.innerText = "✨ إضافة المنتج للمخزن";
            }
        }
    </script>
</body>
</html>
